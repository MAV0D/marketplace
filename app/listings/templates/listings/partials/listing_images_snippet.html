<h4>Listing Images</h4>

<div class="listing-images-gallery" style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
  {% for img in listing.images.all %}
    <div id="listing-image-{{ img.id }}" style="position: relative; width: 100px; height: 100px;">
      <img src="{{ img.file.url }}?t={{ img.uploaded_at|date:'U' }}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px; border: 1px solid #ccc;">
      
      <button type="button"
              hx-post="{% url 'delete_listing_image' img.id %}"
              hx-target="#listing-image-{{ img.id }}"
              hx-swap="outerHTML"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              style="position: absolute; top: 5px; right: 5px; background: rgba(220, 53, 69, 0.9); color: white; border: none; border-radius: 3px; padding: 2px 6px; cursor: pointer; font-size: 11px;">
      </button>
    </div>
  {% endfor %}
</div>

<div class="upload-images-group">
  <label for="id_images" class="custom-file-upload" 
         hx-post="{% url 'upload_listing_images' listing.id %}"
         hx-target="#listing-images-area"
         hx-trigger="change from:#id_images"
         hx-encoding="multipart/form-data" 
         hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
         style="background: #3b35dc; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; display: inline-block;">
    Upload Photos
  </label>

  <div style="display: none;">
    <input type="file" name="images" id="id_images" accept="image/*" multiple>
  </div>
</div>
