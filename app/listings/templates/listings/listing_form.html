{% extends "base.html" %}

{% block title %}New Listing | Larp Marketplace{% endblock %}

{% block content %}
    <h1>Insert new listing</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div id="dynamic-attributes"></div>
        
        <button type="submit">Submit</button>
    </form>
{% endblock %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Django dává poli jméno 'images' ID 'id_images'
    const input = document.getElementById('id_images');
    const previewContainer = document.getElementById('image-preview-container');

    // Kontrola, jestli input existuje, aby JS neházel chyby na jiných stránkách
    if (input) {
        input.addEventListener('change', function() {
            // 1. Vyčistíme kontejner před novým výběrem
            previewContainer.innerHTML = '';

            // 2.this.files obsahuje seznam všech vybraných souborů
            const files = Array.from(this.files);

            files.forEach(file => {
                // Kontrola, zda jde skutečně o obrázek
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();

                    reader.onload = function(e) {
                        // Vytvoříme stylovaný náhled
                        const div = document.createElement('div');
                        div.style.cssText = 'border: 1px solid #ddd; padding: 5px; border-radius: 5px; text-align: center; background: #f9f9f9;';

                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.cssText = 'width: 100px; height: 100px; object-fit: cover; display: block; margin-bottom: 5px;';

                        const span = document.createElement('span');
                        span.textContent = file.name;
                        span.style.cssText = 'font-size: 11px; display: block; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';

                        div.appendChild(img);
                        div.appendChild(span);
                        previewContainer.appendChild(div);
                    };

                    reader.readAsDataURL(file);
                }
            });
        });
    }
});
</script>
