{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A marketplace for LARP gear and accessories.">
  <title>{% block title %}Larp Marketplace{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr" defer></script>
</head>
<body class="bg-larp-dark text-larp-light font-sans min-h-screen flex flex-col justify-between">
  
  <main class="flex-grow">
    {% include "partials/messages.html" %}
    {% block content %}{% endblock %}
  </main>

  </body>
</html>
