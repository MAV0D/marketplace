{% extends "base.html" %}

{% block title %}Validation Failed | Larp Marketplace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-larp-brown p-8 rounded-lg border border-red-900/30 text-center shadow-xl">
        
        <div class="w-12 h-12 rounded-full bg-red-950/50 border border-red-500/30 flex items-center justify-center mx-auto mb-4 text-red-400 text-lg">
            <i class="fa-solid fa-ban"></i>
        </div>

        <h1 class="text-2xl font-serif font-bold text-larp-light uppercase tracking-wide mb-2">Authentication Failed</h1>
        <p class="text-sm text-larp-light/70 mb-6 leading-relaxed">
            The verification string is corrupted, modified, or has expired.
        </p>
        
        <a href="{% url 'index' %}" class="inline-block bg-larp-dark hover:bg-larp-light hover:text-larp-dark border border-larp-copper/40 text-larp-light text-xs font-bold uppercase px-6 py-2.5 rounded tracking-wider transition-all">
            Return to Homepage
        </a>
        
    </div>
</div>
{% endblock %}
