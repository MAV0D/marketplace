{% extends "base.html" %}
{% block content %}
<h2>Set New Password</h2>
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
    </form>
{% else %}
    <p style="color: red;">The password reset link was invalid, possibly because it has already been used or has expired.</p>
{% endif %}
{% endblock %}
