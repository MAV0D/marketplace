{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-larp-brown p-8 rounded-lg border border-larp-copper/20 shadow-2xl">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-serif font-bold text-larp-light uppercase tracking-wide">Log In</h2>
            <p class="text-xs text-larp-light/60 mt-1">Sign in to access your account dashboard and history.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="text-larp-light">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="w-full bg-larp-gold text-larp-dark hover:bg-larp-light font-bold text-sm uppercase py-3 rounded shadow tracking-wider transition-colors duration-200 mt-2">
                Log In
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-larp-light/10 flex flex-col items-center gap-3 text-xs">
            <p class="text-larp-light/60">
                New user? <a href="{% url 'register' %}" class="text-larp-gold hover:underline font-medium ml-1">Create an account here</a>
            </p>
            <a href="{% url 'password_reset' %}" class="text-larp-light/40 hover:text-larp-gold transition-colors">Forgot your password?</a>
        </div>
        
    </div>
</div>
{% endblock %}
