{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>

<p>Don't have an account yet? <a href="{% url 'login' %}">Register here!</a>.</p>
<a href="{% url 'password_reset' %}">Forgot your password?</a>
{% endblock %}
