{% extends "base.html" %}

{% block content %}
<h2>Update my profile</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ user_form.as_p }}
    
    <div id="profile-picture-area" class="profile-picture-section" style="margin-top: 20px; margin-bottom: 20px;">
        {% include "users/partials/profile_picture_snippet.html" %}
    </div>
    
    <button type="submit">Save changes</button>
</form>

<hr>
<h3>Security</h3>
<p><a href="{% url 'password_change' %}">Change password</a></p>

<hr>
<h3>Profile deletion</h3>
<form action="{% url 'delete_profile' user.id %}" method="post" onsubmit="return confirm('Are you sure? This action is irreversible. ');">
    {% csrf_token %}
    <p>
        <label id="delete_confirmation_password_label" for="id_delete_confirmation_password">Account password</label>
        <br>
        <input type="password" name="delete_confirmation_password" id="id_delete_confirmation_password" required autocomplete="current-password">
    </p>
    <button type="submit" class="btn btn-delete" style="background: #dc3545; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">
        Delete
    </button>
</form>
{% endblock %}
