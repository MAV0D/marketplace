{% extends "base.html" %}

{% block content %}
<h2>User profile</h2>

<div class="profile-container" style="max-width: 600px; margin: 20px; font-family: sans-serif;">
    <h2>{{ user.username }}</h2>
    
    <p><strong>E-mail:</strong> {{ user.email }}</p>
    
    <p><strong>Sellers bio:</strong></p>
    <div style="background: #f4f4f4; padding: 15px; border-radius: 4px; min-height: 50px;">
        {% if user.bio %}
            {{ user.bio|linebreaks }}
        {% endif %}
    </div>
    
    <p><small>Account created on: {{ user.date_joined|date:"d. m. Y" }}</small></p>
</div>
{% endblock %}
