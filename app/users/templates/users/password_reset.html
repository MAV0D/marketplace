{% extends "base.html" %}

{% block title %}LARP Marketplace | Password reset{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-larp-brown p-8 rounded-lg border border-larp-copper/20 shadow-2xl">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-serif font-bold text-larp-light uppercase tracking-wide">Reset Password</h1>
      <p class="text-xs text-larp-light/60 mt-1">Enter your email address below, and we'll email you instructions for setting a new one.</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="text-larp-light space-y-4">
        {{ form.as_p }}
      </div>
      
      <button type="submit" class="w-full bg-larp-gold text-larp-dark hover:bg-larp-light font-bold text-sm uppercase py-3 rounded shadow tracking-wider transition-colors duration-200 mt-4">
        Send Reset Email
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-larp-light/10 text-center">
      <a href="{% url 'login' %}" class="text-xs text-larp-light/50 hover:text-larp-gold transition-colors">
        Back to Log In
      </a>
    </div>
    
  </div>
</div>
{% endblock %}
