{% extends "base.html" %}

{% block title %}LARP Marketplace | Password reset successfull{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-larp-brown p-8 rounded-lg border border-larp-copper/20 text-center shadow-xl">
    
    <div class="w-12 h-12 rounded-full bg-green-950/50 border border-green-500/30 flex items-center justify-center mx-auto mb-4 text-green-400 text-lg">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <h1 class="text-2xl font-serif font-bold text-larp-light uppercase tracking-wide mb-2">Password Reset Complete</h1>
    <p class="text-sm text-larp-light/70 mb-6">
      Your new password has been successfully set. You may now proceed to log in to your account.
    </p>
    
    <div class="pt-2">
      <a href="{% url 'login' %}" class="block w-full text-center bg-larp-gold text-larp-dark hover:bg-larp-light font-bold py-3 rounded uppercase text-sm tracking-wider transition-colors shadow">
        Log In Now
      </a>
    </div>
    
  </div>
</div>
{% endblock %}
