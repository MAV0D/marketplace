{% extends "base.html" %}

{% block title %}LARP Marketplace | Password change successfull{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-larp-brown p-8 rounded-lg border border-larp-copper/20 text-center shadow-xl">
        
        <div class="w-12 h-12 rounded-full bg-green-950/50 border border-green-500/30 flex items-center justify-center mx-auto mb-4 text-green-400 text-lg">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1 class="text-2xl font-serif font-bold text-larp-light uppercase tracking-wide mb-2">Password Changed</h1>
        <p class="text-sm text-green-300 bg-green-950/40 p-3 rounded border border-green-900/50 mb-6 font-medium">
            Your account password has been successfully updated in our database.
        </p>
        
        <div class="flex flex-col gap-3 text-xs">
            <a href="{% url 'edit_profile' %}" class="bg-larp-copper text-larp-dark hover:bg-larp-light font-bold py-2.5 rounded uppercase tracking-wider transition-colors">
                Return to Profile
            </a>
            <a href="{% url 'index' %}" class="text-larp-light/50 hover:text-larp-gold transition-colors py-1">
                Go to Homepage
            </a>
        </div>
        
    </div>
</div>
{% endblock %}
