{% extends "base.html" %}

{% block content %}
<div class="password-change-container" style="max-width: 400px; margin: 20px auto;">
    <h2>Password change</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">
            Change password
        </button>
    </form>
</div>
{% endblock %}
